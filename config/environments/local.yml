environment: local

storage:
  scheme: hdfs
  base_uri: hdfs://namenode:9000/data
  raw_uri: hdfs://namenode:9000/data/raw
  processed_uri: hdfs://namenode:9000/data/processed
  curated_uri: hdfs://namenode:9000/data/curated
  scaled_uri: hdfs://namenode:9000/data/scaled
  outputs_uri: hdfs://namenode:9000/data/outputs

spark:
  master: spark://spark-master:7077
  driver_host: app
  driver_port: 39000
  block_manager_port: 39001

chroma:
  host: chroma
  port: 8000
  collection: olist_reviews_e5_v1

rag:
  translation_provider: local
  collection_version: "1"
  embedding_model: intfloat/multilingual-e5-small
  embedding_revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
  embedding_dimension: 384
  embedding_batch_size: 128
  distance_metric: cosine
  passage_prefix: "passage: "
  query_prefix: "query: "
  retrieval_candidate_k: 50
  reranker_model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  reranker_revision: d4be7629a38de7d68378c2f0de8d7ddd8cd756dd
  reranker_batch_size: 16
  reranker_max_length: 512
  theme_classifier_version: rules-pt-v3
  translation_model: Helsinki-NLP/opus-mt-tc-big-itc-itc
  translation_revision: a185ba7b3cac07bbd692dd517577b8c2dc7abb2c
  translation_target_prefix: ">>ita<< "
  translation_cache: /tmp/app-home/translation-cache/translations.sqlite3

llm:
  provider: ollama
  base_url: http://ollama:11434
  model: qwen2.5:1.5b-instruct-q4_K_M
  max_new_tokens: 384
  timeout_seconds: 300
  keep_alive: "0"
  openai_api_url: https://api.openai.com/v1/responses
  openai_model: gpt-5.6-terra
  openai_reasoning_effort: none
  openai_max_output_tokens: 256
  openai_timeout_seconds: 60

application:
  language: it
  source_review_language: pt
