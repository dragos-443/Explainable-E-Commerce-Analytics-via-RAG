environment: aws

storage:
  scheme: s3a
  base_uri: s3a://ecommerce-rag-analytics-5138901/ecommerce-rag
  raw_uri: s3a://ecommerce-rag-analytics-5138901/ecommerce-rag/raw
  processed_uri: s3a://ecommerce-rag-analytics-5138901/ecommerce-rag/processed
  curated_uri: s3a://ecommerce-rag-analytics-5138901/ecommerce-rag/curated
  scaled_uri: s3a://ecommerce-rag-analytics-5138901/ecommerce-rag/scaled
  outputs_uri: s3a://ecommerce-rag-analytics-5138901/ecommerce-rag/outputs

spark:
  master: yarn
  deploy_mode: client

cluster:
  region: us-east-1
  release_label: emr-7.9.0
  spark_version: 3.5.5
  instance_type: m5.xlarge
  primary_nodes: 1
  core_nodes: 2

chroma:
  # Chroma resta locale: la validazione AWS riguarda la pipeline Big Data.
  host: localhost
  port: 8000
  collection: olist_reviews_e5_v1

rag:
  collection_version: "1"
  embedding_model: intfloat/multilingual-e5-small
  embedding_revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
  embedding_dimension: 384
  embedding_batch_size: 128
  distance_metric: cosine
  passage_prefix: "passage: "
  query_prefix: "query: "
  retrieval_candidate_k: 50
  reranker_model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  reranker_revision: d4be7629a38de7d68378c2f0de8d7ddd8cd756dd
  reranker_batch_size: 16
  reranker_max_length: 512
  theme_classifier_version: rules-pt-v3
  translation_model: Helsinki-NLP/opus-mt-tc-big-itc-itc
  translation_revision: a185ba7b3cac07bbd692dd517577b8c2dc7abb2c
  translation_target_prefix: ">>ita<< "
  translation_cache: /tmp/app-home/translation-cache/translations.sqlite3

llm:
  provider: local_transformers
  model: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  max_new_tokens: 384

application:
  language: it
  source_review_language: pt

# Le credenziali AWS devono essere fornite tramite IAM role o variabili d'ambiente.
# Non inserire access key o secret key in questo file.
