environment: aws

# Scheletro da completare nella Fase 10 con nomi e URI reali.
storage:
  scheme: s3a
  base_uri: s3a://REPLACE_WITH_BUCKET/ecommerce-rag
  raw_uri: s3a://REPLACE_WITH_BUCKET/ecommerce-rag/raw
  processed_uri: s3a://REPLACE_WITH_BUCKET/ecommerce-rag/processed
  curated_uri: s3a://REPLACE_WITH_BUCKET/ecommerce-rag/curated
  scaled_uri: s3a://REPLACE_WITH_BUCKET/ecommerce-rag/scaled
  outputs_uri: s3a://REPLACE_WITH_BUCKET/ecommerce-rag/outputs

spark:
  master: yarn
  deploy_mode: client

chroma:
  host: REPLACE_WITH_PRIVATE_HOST
  port: 8000
  collection: olist_reviews_e5_v1

rag:
  collection_version: "1"
  embedding_model: intfloat/multilingual-e5-small
  embedding_revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
  embedding_dimension: 384
  embedding_batch_size: 128
  distance_metric: cosine
  passage_prefix: "passage: "
  query_prefix: "query: "
  theme_classifier_version: rules-pt-v2
  translation_model: Helsinki-NLP/opus-mt-tc-big-itc-itc
  translation_revision: a185ba7b3cac07bbd692dd517577b8c2dc7abb2c
  translation_target_prefix: ">>ita<< "
  translation_cache: /tmp/app-home/translation-cache/translations.sqlite3

llm:
  provider: local_transformers
  model: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  max_new_tokens: 384

application:
  language: it
  source_review_language: pt

# Le credenziali AWS devono essere fornite tramite IAM role o variabili d'ambiente.
# Non inserire access key o secret key in questo file.
